<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор QR-кодов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #334155;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                QR Генератор
            </h1>
            <p class="text-slate-400 text-sm mt-1">Создай кастомный QR-код с градиентом</p>
        </div>

        <div class="mb-5">
            <a id="quickLink" href="#" target="_blank" 
               class="flex items-center justify-center gap-2 w-full bg-slate-800/80 hover:bg-slate-800 text-indigo-400 hover:text-indigo-300 font-medium py-2.5 px-4 rounded-2xl border border-slate-700/50 transition-all text-sm">
                <span>🔗 Открыть приложение в новой вкладке</span>
            </a>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Ссылка или текст</label>
                <input type="text" id="qrInput" placeholder="https://example.com" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <div class="flex items-center justify-between bg-slate-950 border border-slate-800 px-4 py-3 rounded-2xl">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Использовать градиент</span>
                <input type="checkbox" id="gradientToggle" onchange="toggleGradient()" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2" id="labelColor1">Цвет узоров</label>
                    <input type="color" id="fillColor" value="#1e293b">
                </div>
                <div id="endColorContainer" class="hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Конечный цвет</label>
                    <input type="color" id="fillColorEnd" value="#4f46e5">
                </div>
                <div id="bgColorContainer">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Цвет фона</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
            </div>

            <button onclick="generateQR()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] font-semibold py-3.5 rounded-2xl transition-all shadow-lg shadow-indigo-600/30">
                Сгенерировать код
            </button>
        </div>

        <div id="resultContainer" class="hidden mt-6 pt-6 border-t border-slate-800/80 flex flex-col items-center animate-fade-in">
            <div id="qrImageWrapper" class="p-4 rounded-2xl shadow-inner mb-4 inline-block">
                <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 object-contain">
            </div>
            
            <a id="downloadBtn" download="qrcode.png" 
                class="w-full text-center bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 rounded-2xl transition-all border border-slate-700/50">
                Скачать PNG
            </a>
        </div>

    </div>

    <script>
        document.getElementById('quickLink').href = window.location.href;

        function toggleGradient() {
            const isChecked = document.getElementById('gradientToggle').checked;
            const endColorContainer = document.getElementById('endColorContainer');
            const labelColor1 = document.getElementById('labelColor1');

            if (isChecked) {
                endColorContainer.classList.remove('hidden');
                labelColor1.textContent = 'Начальный цвет';
            } else {
                endColorContainer.classList.add('hidden');
                labelColor1.textContent = 'Цвет узоров';
            }
        }

        async function generateQR() {
            const text = document.getElementById('qrInput').value.trim();
            const use_gradient = document.getElementById('gradientToggle').checked;
            const fill_color = document.getElementById('fillColor').value;
            const fill_color_end = document.getElementById('fillColorEnd').value;
            const back_color = document.getElementById('bgColor').value;

            if (!text) return;

            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, use_gradient, fill_color, fill_color_end, back_color })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('qrImage').src = data.qr_image;
                document.getElementById('qrImageWrapper').style.backgroundColor = back_color;
                document.getElementById('downloadBtn').href = data.qr_image;
                document.getElementById('resultContainer').classList.remove('hidden');
            }
        }

        document.getElementById('qrInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>
</html>
